# Copy to config.yaml and adjust. config.yaml is gitignored.
# 复制为 config.yaml 后按需修改（config.yaml 不会被 git 跟踪）。

# Default media / working output directory
media_dir: "./output"

# Preferred Bilibili UP creators (used when searching by title).
# Keep empty by default; put personal lists only in local config.yaml.
preferred_ups: []
# 示例 / Example:
# - "示例UP-A"
# - "示例UP-B"

# Optional: path to your Obsidian vault (literature / permanent cards destination)
# Leave empty to keep drafts only under media_dir.
obsidian_vault: ""

asr:
  model: "paraformer-zh"
  vad_model: "fsmn-vad"
  punc_model: "ct-punc"
